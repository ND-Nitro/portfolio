<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Steffen Heltne, frontend developer"
    />
    <title>Steffen | Frontend Developer</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="hero">
      <div class="hero-inner">
        <div class="logo">
          <img
            src="./image/IMG_20231003_100352_969.jpg"
            alt="Portrait of Steffen"
          />
        </div>

        <h1 class="title">Steffen Heltne</h1>
        <p class="subtitle">Frontend Developer</p>

        <nav class="nav" aria-label="Main menu">
          <a class="btn left" href="#/" data-link>Home</a>
          <a class="btn center" href="#/projects" data-link>Projects</a>
          <a class="btn right" href="#/contact" data-link>Contact</a>
        </nav>

        <section class="top-panels">
          <article class="panel panel-left">
            <p class="panel-text">
              Hello. I am Steffen, a junior frontend developer working towards
              becoming a fullstack developer.
            </p>

            <button class="linklike" data-action="watchVideo" type="button">
              Watch video
            </button>
          </article>

          <article class="panel panel-right">
            <h3 class="panel-title">1 Year Experience In</h3>
            <div class="icons-row">HTML • CSS • JS • FIGMA</div>
          </article>
        </section>
      </div>
    </header>

    <main id="app" class="app" aria-live="polite"></main>

    <script src="app.js"></script>
  </body>
</html>
